<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Coffee Recharge Member Journey</title>
    <meta name="description" content="Coffee Recharge member journey prototype">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/widgets.css">
    <link rel="stylesheet" href="css/animation.css">
  </head>
  <body data-tier="gold">
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="coffee-cup" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="25" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <circle cx="32" cy="32" r="19" stroke="currentColor" stroke-width="1" opacity=".35" fill="none"/>
        <path d="M20 30h21v8.5C41 45.404 36.404 50 29.5 50S18 45.404 18 38.5V32a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M41 33h3.5a4.5 4.5 0 0 1 0 9H41" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M24 23c-1.8-2.2 1.8-3.8 0-6M32 23c-1.8-2.2 1.8-3.8 0-6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" opacity=".75" fill="none"/>
        <path d="M32 7v5M32 52v5M7 32h5M52 32h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".38" fill="none"/>
      </symbol>
      <symbol id="coffee-bean" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="25" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <path d="M45.2 18.8c8.1 8.1 8.9 20.2 1.8 27.3s-19.2 6.3-27.3-1.8-8.9-20.2-1.8-27.3 19.2-6.3 27.3 1.8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M23.2 15.7c1.7 8.8 8.9 10.7 11 16.6 2.1 5.9-1 10.6 3.6 16.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M19.4 42c8-1.1 9.6-6.7 14.8-9.7 5.2-3 9.4-.8 14.6-6.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity=".38" fill="none"/>
      </symbol>
      <symbol id="journey-path" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="25" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <circle cx="32" cy="32" r="18" stroke="currentColor" stroke-width="1" opacity=".32" fill="none"/>
        <path d="M16 42c7.6 0 7.9-20 16-20s8.4 20 16 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="16" cy="42" r="3.2" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <circle cx="32" cy="22" r="3.2" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <circle cx="48" cy="42" r="3.2" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <path d="M32 7v5M32 52v5M7 32h5M52 32h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".42" fill="none"/>
      </symbol>
      <symbol id="milestone-circle" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="25" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <circle cx="32" cy="32" r="15" stroke="currentColor" stroke-width="1.25" fill="none"/>
        <circle cx="32" cy="32" r="5.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M32 6v7M32 51v7M6 32h7M51 32h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="m20.8 20.8-4.2-4.2M47.4 16.6l-4.2 4.2M20.8 43.2l-4.2 4.2M47.4 47.4l-4.2-4.2" stroke="currentColor" stroke-width="1.05" stroke-linecap="round" opacity=".46" fill="none"/>
      </symbol>
      <symbol id="discount" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="25" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <circle cx="32" cy="32" r="18" stroke="currentColor" stroke-width="1" opacity=".32" fill="none"/>
        <path d="m22 42 20-20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="24" cy="24" r="4" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <circle cx="40" cy="40" r="4" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <path d="M32 7v5M32 52v5M7 32h5M52 32h5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity=".38" fill="none"/>
      </symbol>
    </svg>
    <div class="app-bg" aria-hidden="true">
      <div class="tier-atmosphere"></div>
    </div>

    <main class="app-shell">
      <header class="topbar">
        <img class="brand-logo" src="assets/brand/logo-light.png" alt="Coffee Recharge">
        <div class="tier-status-badge" id="tierStatusBadge" aria-label="ระดับสมาชิก">Gold</div>
      </header>

      <section class="screen active" id="searchScreen" aria-labelledby="searchTitle">
        <div class="greeting-block">
          <p class="eyebrow">Member Journey</p>
          <h1 id="searchTitle">เปิดดูสถานะของฉัน</h1>
          <p>กรอกเบอร์ที่ใช้สมัคร แล้วให้ Coffee Recharge ทักทายคุณอีกครั้ง</p>
        </div>

        <form class="glass-panel search-card" id="lookupForm">
          <label for="phoneInput">เบอร์โทรศัพท์</label>
          <div class="phone-row">
            <input id="phoneInput" name="phone" inputmode="tel" autocomplete="tel" placeholder="08x xxx xxxx" value="0812342468">
            <button class="primary-button" type="submit">ดูสมาชิก</button>
          </div>
          <button class="text-button" type="button" id="openRegisterButton">สมัครสมาชิกใหม่</button>
        </form>
      </section>

      <section class="screen" id="memberScreen" aria-live="polite"></section>

      <section class="screen" id="notFoundScreen" aria-labelledby="notFoundTitle">
        <div class="glass-panel state-card">
          <img src="assets/icons/progress-marker.svg" alt="" class="state-icon">
          <p class="eyebrow">Member Journey</p>
          <h2 id="notFoundTitle">ยังไม่พบสมาชิก</h2>
          <p>ตรวจสอบเบอร์อีกครั้ง หรือเริ่มต้น journey ใหม่กับเราได้เลย</p>
          <div class="button-stack">
            <button class="primary-button" type="button" id="retryButton">ลองอีกครั้ง</button>
            <button class="secondary-button" type="button" id="registerFromNotFoundButton">สมัครสมาชิก</button>
          </div>
        </div>
      </section>

      <section class="screen" id="registerScreen" aria-labelledby="registerTitle">
        <div class="greeting-block compact">
          <p class="eyebrow">New Member</p>
          <h1 id="registerTitle">เริ่มต้นกับ Recharge</h1>
        </div>
        <form class="glass-panel register-card" id="registerForm">
          <label>ชื่อที่ใช้แสดง<input name="displayName" required placeholder="เช่น Rei"></label>
          <label>เบอร์โทรศัพท์<input name="phone" required inputmode="tel" placeholder="08x xxx xxxx"></label>
          <label>วันเกิด <span>ไม่บังคับ</span><input name="birthday" type="text" placeholder="DD/MM"></label>
          <label class="check-row"><input name="accept" type="checkbox" required> <span>ยอมรับเงื่อนไขสมาชิก Coffee Recharge</span></label>
          <button class="primary-button full" type="submit">สมัครสมาชิก</button>
          <button class="text-button" type="button" id="backToSearchButton">กลับไปค้นหา</button>
        </form>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
